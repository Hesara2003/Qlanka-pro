version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: ./backend/QueueLanka.Gateway/Dockerfile
    container_name: gateway
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - identity
      - service-center
      - queue
    networks:
      - qlanka-net

  identity:
    build:
      context: .
      dockerfile: ./backend/QueueLanka.Identity/Dockerfile
    container_name: identity
    ports:
      - "5001:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db-identity;Port=5432;Database=identity_db;Username=qlanka;PasswordFile=/run/secrets/db_password
      - Jwt__Secret=/run/secrets/jwt_secret
      - Jwt__Issuer=queuelanka-api
      - Jwt__Audience=queuelanka-client
      - Email__Smtp__Host=localhost
      - Email__Smtp__Port=1025
      - Email__Smtp__Username=test
      - Email__Smtp__Password=test
      - Email__From__Address=noreply@queuelanka.com
    secrets:
      - db_password
      - jwt_secret
    depends_on:
      - db-identity
    networks:
      - qlanka-net

  service-center:
    build:
      context: .
      dockerfile: ./backend/QueueLanka.ServiceCenter/Dockerfile
    container_name: service-center
    ports:
      - "5002:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db-service-center;Port=5432;Database=servicecenters_db;Username=qlanka;PasswordFile=/run/secrets/db_password
      - Jwt__Secret=/run/secrets/jwt_secret
      - Jwt__Issuer=queuelanka-api
      - Jwt__Audience=queuelanka-client
    secrets:
      - db_password
      - jwt_secret
    depends_on:
      - db-service-center
    networks:
      - qlanka-net

  queue:
    build:
      context: .
      dockerfile: ./backend/QueueLanka.Queue/Dockerfile
    container_name: queue
    ports:
      - "5003:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db-queue;Port=5432;Database=queue_db;Username=qlanka;PasswordFile=/run/secrets/db_password
      - Jwt__Secret=/run/secrets/jwt_secret
      - Jwt__Issuer=queuelanka-api
      - Jwt__Audience=queuelanka-client
      - ServiceUrls__ServiceCenter=http://service-center:80/
    secrets:
      - db_password
      - jwt_secret
    depends_on:
      - db-queue
    networks:
      - qlanka-net

  notification:
    build:
      context: .
      dockerfile: ./backend/QueueLanka.Notification/Dockerfile
    container_name: notification
    ports:
      - "5004:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Email__Smtp__Host=localhost
      - Email__Smtp__Port=1025
      - Email__Smtp__Username=test
      - Email__Smtp__Password=test
      - Email__From__Address=noreply@queuelanka.com
    networks:
      - qlanka-net

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://gateway:5000
    depends_on:
      - gateway
    networks:
      - qlanka-net

  db-identity:
    image: postgres:16
    container_name: db-identity
    environment:
      - POSTGRES_USER=qlanka
      - POSTGRES_DB=identity_db
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
    secrets:
      - db_password
    ports:
      - "5431:5432"
    volumes:
      - db_identity_data:/var/lib/postgresql/data
    networks:
      - qlanka-net

  db-service-center:
    image: postgres:16
    container_name: db-service-center
    environment:
      - POSTGRES_USER=qlanka
      - POSTGRES_DB=servicecenters_db
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
    secrets:
      - db_password
    ports:
      - "5432:5432"
    volumes:
      - db_servicecenter_data:/var/lib/postgresql/data
    networks:
      - qlanka-net

  db-queue:
    image: postgres:16
    container_name: db-queue
    environment:
      - POSTGRES_USER=qlanka
      - POSTGRES_DB=queue_db
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
    secrets:
      - db_password
    ports:
      - "5433:5432"
    volumes:
      - db_queue_data:/var/lib/postgresql/data
    networks:
      - qlanka-net

volumes:
  db_identity_data:
  db_servicecenter_data:
  db_queue_data:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt

networks:
  qlanka-net:
    driver: bridge
