services:
  gateway:
    build:
      context: .
      dockerfile: ./backend/QueueLanka.Gateway/Dockerfile
    container_name: gateway
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - identity
      - service-center
      - queue
    networks:
      - qlanka-net

  identity:
    build:
      context: .
      dockerfile: ./backend/QueueLanka.Identity/Dockerfile
    container_name: identity
    ports:
      - "5001:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db-identity;Port=3306;Database=identity_db;Uid=qlanka;Pwd=P@ssw0rd123
      - Jwt__Secret=/run/secrets/jwt_secret
      - Jwt__Issuer=queuelanka-api
      - Jwt__Audience=queuelanka-client
      - Email__Smtp__Host=localhost
      - Email__Smtp__Port=1025
      - Email__Smtp__Username=test
      - Email__Smtp__Password=test
      - Email__From__Address=noreply@queuelanka.com
    secrets:
      - db_password
      - jwt_secret
    depends_on:
      - db-identity
    networks:
      - qlanka-net

  service-center:
    build:
      context: .
      dockerfile: ./backend/QueueLanka.ServiceCenter/Dockerfile
    container_name: service-center
    ports:
      - "5002:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db-service-center;Port=3306;Database=servicecenters_db;Uid=qlanka;Pwd=P@ssw0rd123
      - Jwt__Secret=/run/secrets/jwt_secret
      - Jwt__Issuer=queuelanka-api
      - Jwt__Audience=queuelanka-client
    secrets:
      - db_password
      - jwt_secret
    depends_on:
      - db-service-center
    networks:
      - qlanka-net

  queue:
    build:
      context: .
      dockerfile: ./backend/QueueLanka.Queue/Dockerfile
    container_name: queue
    ports:
      - "5003:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db-queue;Port=3306;Database=queue_db;Uid=qlanka;Pwd=P@ssw0rd123
      - Jwt__Secret=/run/secrets/jwt_secret
      - Jwt__Issuer=queuelanka-api
      - Jwt__Audience=queuelanka-client
      - ServiceUrls__ServiceCenter=http://service-center:80/
    secrets:
      - db_password
      - jwt_secret
    depends_on:
      - db-queue
    networks:
      - qlanka-net

  notification:
    build:
      context: .
      dockerfile: ./backend/QueueLanka.Notification/Dockerfile
    container_name: notification
    ports:
      - "5004:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Email__Smtp__Host=localhost
      - Email__Smtp__Port=1025
      - Email__Smtp__Username=test
      - Email__Smtp__Password=test
      - Email__From__Address=noreply@queuelanka.com
    networks:
      - qlanka-net

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
    depends_on:
      - gateway
    networks:
      - qlanka-net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=2GB"
      - "--web.enable-lifecycle"
    volumes:
      - ./deploy/infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - gateway
      - identity
      - service-center
      - queue
      - notification
    networks:
      - qlanka-net

  grafana:
    image: grafana/grafana:11.2.2
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=
    volumes:
      - ./deploy/infrastructure/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/infrastructure/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - qlanka-net

  db-identity:
    image: mysql:8.0
    container_name: db-identity
    environment:
      - MYSQL_USER=qlanka
      - MYSQL_DATABASE=identity_db
      - MYSQL_PASSWORD_FILE=/run/secrets/db_password
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db_password
    secrets:
      - db_password
    ports:
      - "33061:3306"
    volumes:
      - db_identity_data:/var/lib/mysql
    networks:
      - qlanka-net

  db-service-center:
    image: mysql:8.0
    container_name: db-service-center
    environment:
      - MYSQL_USER=qlanka
      - MYSQL_DATABASE=servicecenters_db
      - MYSQL_PASSWORD_FILE=/run/secrets/db_password
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db_password
    secrets:
      - db_password
    ports:
      - "33062:3306"
    volumes:
      - db_servicecenter_data:/var/lib/mysql
    networks:
      - qlanka-net

  db-queue:
    image: mysql:8.0
    container_name: db-queue
    environment:
      - MYSQL_USER=qlanka
      - MYSQL_DATABASE=queue_db
      - MYSQL_PASSWORD_FILE=/run/secrets/db_password
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db_password
    secrets:
      - db_password
    ports:
      - "33063:3306"
    volumes:
      - db_queue_data:/var/lib/mysql
    networks:
      - qlanka-net

volumes:
  db_identity_data:
  db_servicecenter_data:
  db_queue_data:
  prometheus_data:
  grafana_data:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt

networks:
  qlanka-net:
    driver: bridge
