global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: gateway
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - localhost:5012

  - job_name: identity
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets:
          - localhost:5177

  - job_name: service-center
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets:
          - localhost:5137

  - job_name: queue
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - localhost:5239

  - job_name: api
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets:
          - localhost:5000
