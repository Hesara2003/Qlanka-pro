global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: identity
    scheme: https
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets:
          - qlanka-micro-identity.salmonisland-da9fa0a9.eastasia.azurecontainerapps.io

  - job_name: service-centre
    scheme: https
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets:
          - qlanka-micro-servicecentre.salmonisland-da9fa0a9.eastasia.azurecontainerapps.io

  - job_name: queue
    scheme: https
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - qlanka-micro-queue.salmonisland-da9fa0a9.eastasia.azurecontainerapps.io
