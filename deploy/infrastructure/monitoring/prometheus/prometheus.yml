global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: gateway
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - gateway:80

  - job_name: identity
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets:
          - identity:80

  - job_name: service-center
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets:
          - service-center:80

  - job_name: queue
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - queue:80

  - job_name: notification
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets:
          - notification:80
