name: Trigger auto deployment for qlanka-servicecenter

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ feature/microservices ]
    paths:
    - '**'
    - '.github/workflows/qlanka-servicecenter-AutoDeployTrigger-63336db8-bed5-4c53-b26d-be66716784f9.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.QLANKASERVICECENTER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.QLANKASERVICECENTER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.QLANKASERVICECENTER_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: qlankaregistry.azurecr.io
          registryUsername: ${{ secrets.QLANKASERVICECENTER_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.QLANKASERVICECENTER_REGISTRY_PASSWORD }}
          containerAppName: qlanka-servicecenter
          resourceGroup: rg-queuelanka-pro
          imageToBuild: qlankaregistry.azurecr.io/qlanka-servicecenter:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


