name: CI Pipeline

on:
  push:
    branches: [feature/microservices, final-production]
  pull_request:
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 – Build & test (runs on every push/PR)
  # ─────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore Qlanka-pro.sln

    - name: Build solution
      run: dotnet build Qlanka-pro.sln --configuration Release --no-restore

    - name: Run tests
      run: dotnet test Qlanka-pro.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

    - name: Detect backend coverage files
      if: always()
      id: coverage_check
      shell: bash
      run: |
        if find ./TestResults -name 'coverage.cobertura.xml' | head -n 1 | grep -q .; then
          echo "has_coverage=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_coverage=false" >> "$GITHUB_OUTPUT"
          echo "No coverage.cobertura.xml files found; skipping report generation."
        fi

    - name: Generate backend coverage report
      if: ${{ always() && steps.coverage_check.outputs.has_coverage == 'true' }}
      uses: danielpalme/ReportGenerator-GitHub-Action@5.3.8
      with:
        reports: ./TestResults/**/coverage.cobertura.xml
        targetdir: ./TestResults/CoverageReport
        reporttypes: HtmlInline;Cobertura;TextSummary
        verbosity: Info

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: ./TestResults/**/*.trx

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-coverage-raw
        path: ./TestResults/**/coverage.cobertura.xml

    - name: Upload generated backend coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-coverage-report
        path: ./TestResults/CoverageReport/**

    # Deployments are handled by dedicated workflows:
    # - .github/workflows/deploy-microservices.yml
    # - .github/workflows/deploy-frontend.yml




