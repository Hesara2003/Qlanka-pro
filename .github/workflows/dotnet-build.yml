name: CI Pipeline

on:
  push:
    branches: [feature/microservices]
  pull_request:
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 – Build & test (runs on every push/PR)
  # ─────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore Qlanka-pro.sln

    - name: Build solution
      run: dotnet build Qlanka-pro.sln --configuration Release --no-restore

    - name: Run tests
      shell: bash
      run: |
        set -euo pipefail

        mapfile -t test_projects < <(find backend -name "*.Tests.csproj" | sort)

        if [ ${#test_projects[@]} -eq 0 ]; then
          echo "No test projects were found under backend/"
          exit 1
        fi

        mkdir -p TestResults

        for project in "${test_projects[@]}"; do
          project_name="$(basename "$project" .csproj)"
          echo "Running tests for $project_name ($project)"
          dotnet test "$project" \
            --configuration Release \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --logger "trx;LogFileName=${project_name}.trx" \
            --results-directory "./TestResults/${project_name}"
        done

    - name: Generate backend coverage report
      if: always()
      uses: danielpalme/ReportGenerator-GitHub-Action@5.3.8
      with:
        reports: ./TestResults/**/coverage.cobertura.xml
        targetdir: ./TestResults/CoverageReport
        reporttypes: HtmlInline;Cobertura;TextSummary
        verbosity: Info

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: ./TestResults/**/*.trx

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-coverage-raw
        path: ./TestResults/**/coverage.cobertura.xml

    - name: Upload generated backend coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-coverage-report
        path: ./TestResults/CoverageReport/**

    # Deployments are handled by dedicated workflows:
    # - .github/workflows/deploy-microservices.yml
    # - .github/workflows/deploy-frontend.yml




