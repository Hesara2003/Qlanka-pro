name: CI / CD Pipeline

on:
  push:
  pull_request:

env:
  AZURE_WEBAPP_URL: https://queuelanka-api-fwhthqd4g9e0aee2.centralindia-01.azurewebsites.net

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 – Build & test (runs on every push/PR)
  # ─────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore Qlanka-pro.sln

    - name: Build solution
      run: dotnet build Qlanka-pro.sln --configuration Release --no-restore

    - name: Run tests
      run: dotnet test Qlanka-pro.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: ./TestResults/**/*.trx

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: ./TestResults/**/coverage.cobertura.xml

    # Publish the API and stash the artefact for the deploy job
    - name: Publish backend
      if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
      run: dotnet publish backend/QueueLanka.API/QueueLanka.API.csproj --configuration Release --no-build --runtime linux-x64 --self-contained false --output ./publish/backend

    - name: Upload backend artefact
      if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
      uses: actions/upload-artifact@v4
      with:
        name: backend-publish
        path: ./publish/backend

  # ─────────────────────────────────────────────
  # JOB 2 – Deploy backend to Azure App Service
  #         (push to develop branch only)
  # ─────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Azure App Service
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment:
      name: develop
      url: ${{ env.AZURE_WEBAPP_URL }}

    steps:
    - name: Download backend artefact
      uses: actions/download-artifact@v4
      with:
        name: backend-publish
        path: ./publish/backend

    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./publish/backend

    - name: Wait for App Service to be ready
      run: sleep 60

    - name: Verify backend deployment
      run: |
        url="${{ env.AZURE_WEBAPP_URL }}/health"
        echo "Checking $url ..."
        for i in $(seq 1 15); do
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url" || echo "000")
          if [ "$status" = "200" ]; then
            echo "Backend deployment verified – HTTP $status (attempt $i)"
            exit 0
          fi
          echo "Attempt $i/15 – HTTP $status. Retrying in 20 seconds..."
          sleep 20
        done
        echo "Health check failed after 15 attempts."
        exit 1
