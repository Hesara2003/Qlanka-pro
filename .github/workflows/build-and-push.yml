name: Build and Push Microservices to ACR

on:
  push:
    branches:
      - feature/microservices
    paths:
      - 'backend/**'
      - '.github/workflows/**'

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }} # e.g. qlankaregistry.azurecr.io
  ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
  ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ env.ACR_PASSWORD }}

      # ==== Build Identity Service ====
      - name: Build and Push Identity Service
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/qlanka/identity:${{ github.sha }} -t ${{ env.ACR_LOGIN_SERVER }}/qlanka/identity:latest -f backend/QueueLanka.Identity/Dockerfile backend/
          docker push --all-tags ${{ env.ACR_LOGIN_SERVER }}/qlanka/identity

      # ==== Build ServiceCenter Service ====
      - name: Build and Push ServiceCenter Service
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/qlanka/servicecenter:${{ github.sha }} -t ${{ env.ACR_LOGIN_SERVER }}/qlanka/servicecenter:latest -f backend/QueueLanka.ServiceCenter/Dockerfile backend/
          docker push --all-tags ${{ env.ACR_LOGIN_SERVER }}/qlanka/servicecenter

      # ==== Build Queue Service ====
      - name: Build and Push Queue Service
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/qlanka/queue:${{ github.sha }} -t ${{ env.ACR_LOGIN_SERVER }}/qlanka/queue:latest -f backend/QueueLanka.Queue/Dockerfile backend/
          docker push --all-tags ${{ env.ACR_LOGIN_SERVER }}/qlanka/queue

      # ==== Build Notification Service ====
      - name: Build and Push Notification Service
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/qlanka/notification:${{ github.sha }} -t ${{ env.ACR_LOGIN_SERVER }}/qlanka/notification:latest -f backend/QueueLanka.Notification/Dockerfile backend/
          docker push --all-tags ${{ env.ACR_LOGIN_SERVER }}/qlanka/notification

      # ==== Build Gateway Service ====
      - name: Build and Push API Gateway
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/qlanka/gateway:${{ github.sha }} -t ${{ env.ACR_LOGIN_SERVER }}/qlanka/gateway:latest -f backend/QueueLanka.Gateway/Dockerfile backend/
          docker push --all-tags ${{ env.ACR_LOGIN_SERVER }}/qlanka/gateway
