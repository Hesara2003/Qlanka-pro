name: Build, Push & Deploy Microservices

on:
  push:
    branches: [feature/microservices, main]
  workflow_dispatch:
    inputs:
      rollout_percent:
        description: "Percent of traffic to route to the newly deployed revision (1-100)"
        required: false
        default: "100"
        type: string

jobs:
  # ── Job 1: Build Docker images and push to ACR ──────────────────────────────
  # Requires only ACR_USERNAME + ACR_PASSWORD. No Azure login needed.
  build-push:
    name: Build & Push / ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER || 'qlanka-hrhza8d0ccd6dqa4.azurecr.io' }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: qlanka-micro-identity
            dockerfile: QueueLanka.Identity/Dockerfile
          - name: qlanka-micro-servicecentre
            dockerfile: QueueLanka.ServiceCenter/Dockerfile
          - name: qlanka-micro-queue
            dockerfile: QueueLanka.Queue/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ACR_USERNAME:-}" ] || [ -z "${ACR_PASSWORD:-}" ]; then
            echo "ACR_USERNAME and ACR_PASSWORD secrets are required."
            exit 1
          fi
          echo "$ACR_PASSWORD" | docker login "$ACR_LOGIN_SERVER" \
            --username "$ACR_USERNAME" --password-stdin

      - name: Build and push ${{ matrix.service.name }}
        run: |
          IMAGE_TAG="${ACR_LOGIN_SERVER}/${{ matrix.service.name }}:${{ github.sha }}"
          IMAGE_LATEST="${ACR_LOGIN_SERVER}/${{ matrix.service.name }}:latest"

          docker build \
            -t "$IMAGE_TAG" \
            -t "$IMAGE_LATEST" \
            -f backend/${{ matrix.service.dockerfile }} backend

          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"
          echo "Pushed $IMAGE_TAG"

  # ── Job 2: Update Container Apps revisions ──────────────────────────────────
  # Requires AZURE_CREDENTIALS (SP JSON). Skips gracefully if not set.
  deploy:
    name: Deploy / ${{ matrix.service.containerapp }}
    runs-on: ubuntu-latest
    needs: build-push
    permissions:
      id-token: write
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER || 'qlanka-hrhza8d0ccd6dqa4.azurecr.io' }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'qlanka-microservices' }}
      ROLLOUT_PERCENT: ${{ github.event.inputs.rollout_percent || '100' }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: qlanka-micro-identity
            containerapp: qlanka-micro-identity
            min_replicas: 2
            max_replicas: 10
            http_concurrency: 60
          - name: qlanka-micro-servicecentre
            containerapp: qlanka-micro-servicecentre
            min_replicas: 2
            max_replicas: 10
            http_concurrency: 60
          - name: qlanka-micro-queue
            containerapp: qlanka-micro-queue
            min_replicas: 3
            max_replicas: 15
            http_concurrency: 40

    steps:
      - name: Check Azure credentials
        id: auth_check
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [ -n "${AZURE_CREDENTIALS:-}" ]; then
            echo "mode=sp-json" >> "$GITHUB_OUTPUT"
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${AZURE_CLIENT_ID:-}" ] && [ -n "${AZURE_TENANT_ID:-}" ] && [ -n "${AZURE_SUBSCRIPTION_ID:-}" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::AZURE_CREDENTIALS not set — images pushed to ACR but Container Apps NOT updated. Run the deploy-containerapps workflow manually from Cloud Shell."
          fi

      - name: Azure login (service principal JSON)
        if: steps.auth_check.outputs.mode == 'sp-json'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Azure login (OIDC)
        if: steps.auth_check.outputs.mode == 'oidc'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Container Apps CLI extension
        if: steps.auth_check.outputs.available == 'true'
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Deploy with autoscaling and traffic rules
        if: steps.auth_check.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "$ROLLOUT_PERCENT" =~ ^[0-9]+$ ]] || \
             [ "$ROLLOUT_PERCENT" -lt 1 ] || [ "$ROLLOUT_PERCENT" -gt 100 ]; then
            echo "rollout_percent must be an integer from 1 to 100."
            exit 1
          fi

          APP_NAME="${{ matrix.service.containerapp }}"
          IMAGE_TAG="${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service.name }}:${{ github.sha }}"

          az containerapp revision set-mode \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --mode multiple

          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE_TAG" \
            --min-replicas "${{ matrix.service.min_replicas }}" \
            --max-replicas "${{ matrix.service.max_replicas }}" \
            --scale-rule-name "http-concurrency" \
            --scale-rule-type http \
            --scale-rule-http-concurrency "${{ matrix.service.http_concurrency }}"

          NEW_REVISION=$(az containerapp revision list \
            --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query "sort_by([].{name:name,created:properties.createdTime}, &created)[-1].name" \
            -o tsv)

          OLD_REVISION=$(az containerapp revision list \
            --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query "sort_by([].{name:name,created:properties.createdTime}, &created)[-2].name" \
            -o tsv)

          REMAINING_PERCENT=$((100 - ROLLOUT_PERCENT))

          if [ "$REMAINING_PERCENT" -gt 0 ] && [ -n "${OLD_REVISION:-}" ]; then
            az containerapp ingress traffic set \
              --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --revision-weight "$NEW_REVISION=$ROLLOUT_PERCENT" "$OLD_REVISION=$REMAINING_PERCENT"
          else
            az containerapp ingress traffic set \
              --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --revision-weight "$NEW_REVISION=100"
          fi

          echo "Deployed $APP_NAME → $IMAGE_TAG"
          az containerapp ingress traffic show \
            --name "$APP_NAME" --resource-group "$RESOURCE_GROUP"
