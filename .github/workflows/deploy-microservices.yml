name: Build & Push Microservices

on:
  push:
    branches: [feature/microservices, main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: qlanka-gateway
            dockerfile: QueueLanka.Gateway/Dockerfile
            containerapp: qlanka-gateway
          - name: qlanka-identity
            dockerfile: QueueLanka.Identity/Dockerfile
            containerapp: qlanka-identity
          - name: qlanka-servicecenter
            dockerfile: QueueLanka.ServiceCenter/Dockerfile
            containerapp: qlanka-servicecenter
          - name: qlanka-queue
            dockerfile: QueueLanka.Queue/Dockerfile
            containerapp: qlanka-queue
          - name: qlanka-notification
            dockerfile: QueueLanka.Notification/Dockerfile
            containerapp: qlanka-notification

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: qlankaregistry.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push ${{ matrix.service.name }}
        run: |
          docker build \
            -t qlankaregistry.azurecr.io/${{ matrix.service.name }}:${{ github.sha }} \
            -t qlankaregistry.azurecr.io/${{ matrix.service.name }}:latest \
            -f backend/${{ matrix.service.dockerfile }} backend
          docker push qlankaregistry.azurecr.io/${{ matrix.service.name }}:${{ github.sha }}
          docker push qlankaregistry.azurecr.io/${{ matrix.service.name }}:latest

  deploy-containerapps:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        service:
          - name: qlanka-gateway
            containerapp: qlanka-gateway
          - name: qlanka-identity
            containerapp: qlanka-identity
          - name: qlanka-servicecenter
            containerapp: qlanka-servicecenter
          - name: qlanka-queue
            containerapp: qlanka-queue
          - name: qlanka-notification
            containerapp: qlanka-notification

    steps:
      - name: Azure login with service principal JSON
        if: ${{ secrets.AZURE_CREDENTIALS != '' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Azure login with OIDC
        if: ${{ secrets.AZURE_CREDENTIALS == '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy ${{ matrix.service.name }} image to Container App
        shell: bash
        run: |
          az containerapp update \
            --name "${{ matrix.service.containerapp }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "qlankaregistry.azurecr.io/${{ matrix.service.name }}:${{ github.sha }}"

      - name: Set Queue env vars
        if: ${{ matrix.service.name == 'qlanka-queue' }}
        shell: bash
        run: |
          az containerapp update \
            --name "${{ matrix.service.containerapp }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --set-env-vars \
              ServiceUrls__ServiceCenter=https://qlanka-servicecenter.internal.redrock-2a740b8b.centralindia.azurecontainerapps.io/ \
              Jwt__Issuer=queuelanka-api \
              Jwt__Audience=queuelanka-client

      - name: Route 100% traffic to newest revision
        shell: bash
        run: |
          az containerapp revision set-mode \
            --name "${{ matrix.service.containerapp }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --mode single

  post-deploy-smoke:
    runs-on: ubuntu-latest
    needs: deploy-containerapps
    env:
      GATEWAY_URL: ${{ vars.GATEWAY_PUBLIC_URL }}

    steps:
      - name: Resolve gateway URL
        shell: bash
        run: |
          if [ -z "${GATEWAY_URL}" ]; then
            echo "GATEWAY_URL=https://qlanka-gateway.redrock-2a740b8b.centralindia.azurecontainerapps.io" >> "$GITHUB_ENV"
          fi

      - name: Verify gateway health endpoint
        shell: bash
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "${GATEWAY_URL}/health" || echo "000")
          if [ "$status" != "200" ]; then
            echo "Gateway health check failed with HTTP $status"
            exit 1
          fi

      - name: Verify appointment route is reachable
        shell: bash
        run: |
          status=$(curl -s -o /tmp/appointment-response.txt -w "%{http_code}" \
            -X POST "${GATEWAY_URL}/api/appointment/book" \
            -H "Content-Type: application/json" \
            -d '{"centerId":1,"appointmentDate":"2026-03-24T00:00:00Z","appointmentTime":"10:00:00"}' || echo "000")

          echo "appointment route status: $status"
          cat /tmp/appointment-response.txt || true

          if [ "$status" = "404" ] || [ "$status" = "000" ]; then
            echo "Appointment route is not reachable (HTTP $status)."
            exit 1
          fi

          if [ "$status" != "401" ] && [ "$status" != "403" ] && [ "$status" != "400" ] && [ "$status" != "409" ] && [ "$status" != "200" ]; then
            echo "Unexpected appointment route status: $status"
            exit 1
          fi
