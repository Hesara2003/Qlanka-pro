name: Build, Push & Deploy Microservices

on:
  push:
    branches: [feature/microservices, main]
  workflow_dispatch:
    inputs:
      rollout_percent:
        description: "Percent of traffic to route to the newly deployed revision (1-100)"
        required: false
        default: "100"
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ACR_NAME: ${{ vars.ACR_NAME || 'qlanka' }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER || 'qlanka-hrhza8d0ccd6dqa4.azurecr.io' }}
      RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP || vars.AZURE_RESOURCE_GROUP || 'qlanka-microservices' }}
      ROLLOUT_PERCENT: ${{ github.event.inputs.rollout_percent || '100' }}
      AZURE_CLIENT_ID_FALLBACK: ${{ secrets.AZURE_CLIENT_ID || secrets.QLANKAQUEUE_AZURE_CLIENT_ID || secrets.QLANKAIDENTITY_AZURE_CLIENT_ID || secrets.QLANKASERVICECENTER_AZURE_CLIENT_ID || secrets.QLANKAOFFICER_AZURE_CLIENT_ID }}
      AZURE_TENANT_ID_FALLBACK: ${{ secrets.AZURE_TENANT_ID || secrets.QLANKAQUEUE_AZURE_TENANT_ID || secrets.QLANKAIDENTITY_AZURE_TENANT_ID || secrets.QLANKASERVICECENTER_AZURE_TENANT_ID || secrets.QLANKAOFFICER_AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID_FALLBACK: ${{ secrets.AZURE_SUBSCRIPTION_ID || secrets.QLANKAQUEUE_AZURE_SUBSCRIPTION_ID || secrets.QLANKAIDENTITY_AZURE_SUBSCRIPTION_ID || secrets.QLANKASERVICECENTER_AZURE_SUBSCRIPTION_ID || secrets.QLANKAOFFICER_AZURE_SUBSCRIPTION_ID }}
    strategy:
      matrix:
        service:
          - name: qlanka-micro-identity
            dockerfile: QueueLanka.Identity/Dockerfile
            containerapp: qlanka-micro-identity
            min_replicas: 2
            max_replicas: 10
            http_concurrency: 60
          - name: qlanka-micro-servicecentre
            dockerfile: QueueLanka.ServiceCenter/Dockerfile
            containerapp: qlanka-micro-servicecentre
            min_replicas: 2
            max_replicas: 10
            http_concurrency: 60
          - name: qlanka-micro-queue
            dockerfile: QueueLanka.Queue/Dockerfile
            containerapp: qlanka-micro-queue
            min_replicas: 3
            max_replicas: 15
            http_concurrency: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve Azure auth mode
        id: authmode
        shell: bash
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_CLIENT_ID: ${{ env.AZURE_CLIENT_ID_FALLBACK }}
          AZURE_TENANT_ID: ${{ env.AZURE_TENANT_ID_FALLBACK }}
          AZURE_SUBSCRIPTION_ID: ${{ env.AZURE_SUBSCRIPTION_ID_FALLBACK }}
        run: |
          set -euo pipefail

          if [ -n "${AZURE_CREDENTIALS:-}" ]; then
            if ! echo "$AZURE_CREDENTIALS" | jq -e '.clientId and .clientSecret and .subscriptionId and .tenantId' >/dev/null 2>&1; then
              echo "AZURE_CREDENTIALS is present but invalid. It must include clientId, clientSecret, subscriptionId, tenantId."
              exit 1
            fi

            echo "mode=sp-json" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${AZURE_CLIENT_ID:-}" ] && [ -n "${AZURE_TENANT_ID:-}" ] && [ -n "${AZURE_SUBSCRIPTION_ID:-}" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Azure login secrets are incomplete. Provide either AZURE_CREDENTIALS JSON, or AZURE_CLIENT_ID + AZURE_TENANT_ID + AZURE_SUBSCRIPTION_ID."
          exit 1

      - name: Azure login (service principal JSON)
        if: ${{ steps.authmode.outputs.mode == 'sp-json' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Azure login (OIDC)
        if: ${{ steps.authmode.outputs.mode == 'oidc' }}
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID_FALLBACK }}
          tenant-id: ${{ env.AZURE_TENANT_ID_FALLBACK }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID_FALLBACK }}

      - name: Ensure Container Apps CLI extension
        run: |
          az extension add --name containerapp --upgrade --only-show-errors

      - name: Log in to Azure Container Registry
        shell: bash
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "${ACR_USERNAME:-}" ] && [ -n "${ACR_PASSWORD:-}" ]; then
            echo "$ACR_PASSWORD" | docker login "$ACR_LOGIN_SERVER" --username "$ACR_USERNAME" --password-stdin
            exit 0
          fi

          echo "ACR_USERNAME/ACR_PASSWORD not set; falling back to az acr login for $ACR_NAME"
          az acr login --name "$ACR_NAME"

      - name: Build and push ${{ matrix.service.name }}
        run: |
          IMAGE_TAG="${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service.name }}:${{ github.sha }}"
          IMAGE_LATEST="${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service.name }}:latest"

          docker build \
            -t "$IMAGE_TAG" \
            -t "$IMAGE_LATEST" \
            -f backend/${{ matrix.service.dockerfile }} backend
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"

      - name: Deploy with autoscaling and traffic rules
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${RESOURCE_GROUP:-}" ]; then
            echo "RESOURCE_GROUP is missing. Set AZURE_RESOURCE_GROUP secret/variable or keep fallback value in workflow."
            exit 1
          fi

          if ! [[ "$ROLLOUT_PERCENT" =~ ^[0-9]+$ ]] || [ "$ROLLOUT_PERCENT" -lt 1 ] || [ "$ROLLOUT_PERCENT" -gt 100 ]; then
            echo "rollout_percent must be an integer from 1 to 100."
            exit 1
          fi

          APP_NAME="${{ matrix.service.containerapp }}"
          IMAGE_TAG="${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service.name }}:${{ github.sha }}"

          az containerapp revision set-mode \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --mode multiple

          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE_TAG" \
            --min-replicas "${{ matrix.service.min_replicas }}" \
            --max-replicas "${{ matrix.service.max_replicas }}" \
            --scale-rule-name "http-concurrency" \
            --scale-rule-type http \
            --scale-rule-http-concurrency "${{ matrix.service.http_concurrency }}"

          NEW_REVISION=$(az containerapp revision list \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "sort_by([].{name:name,created:properties.createdTime}, &created)[-1].name" \
            -o tsv)

          OLD_REVISION=$(az containerapp revision list \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "sort_by([].{name:name,created:properties.createdTime}, &created)[-2].name" \
            -o tsv)

          REMAINING_PERCENT=$((100 - ROLLOUT_PERCENT))

          if [ "$REMAINING_PERCENT" -gt 0 ] && [ -n "$OLD_REVISION" ]; then
            az containerapp ingress traffic set \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --revision-weight "$NEW_REVISION=$ROLLOUT_PERCENT" "$OLD_REVISION=$REMAINING_PERCENT"
          else
            az containerapp ingress traffic set \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --revision-weight "$NEW_REVISION=100"
          fi

          echo "Traffic status for $APP_NAME"
          az containerapp ingress traffic show \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP"
