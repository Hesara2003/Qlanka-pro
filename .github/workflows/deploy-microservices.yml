name: Build & Push Microservices

on:
  push:
    branches: [feature/microservices, main, final-production]
  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: qlanka-hrhza8d0ccd6dqa4.azurecr.io
  QUEUE_SERVICECENTER_URL: https://qlanka-micro-servicecentre.salmonisland-da9fa0a9.eastasia.azurecontainerapps.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: qlanka-micro-identity
            dockerfile: QueueLanka.Identity/Dockerfile
            containerapp: qlanka-micro-identity
          - name: qlanka-micro-servicecentre
            dockerfile: QueueLanka.ServiceCenter/Dockerfile
            containerapp: qlanka-micro-servicecentre
          - name: qlanka-micro-queue
            dockerfile: QueueLanka.Queue/Dockerfile
            containerapp: qlanka-micro-queue

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push ${{ matrix.service.name }}
        run: |
          docker build \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service.name }}:${{ github.sha }} \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service.name }}:latest \
            -f backend/${{ matrix.service.dockerfile }} backend
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service.name }}:${{ github.sha }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service.name }}:latest

  deploy-containerapps:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        service:
          - name: qlanka-micro-identity
            containerapp: qlanka-micro-identity
          - name: qlanka-micro-servicecentre
            containerapp: qlanka-micro-servicecentre
          - name: qlanka-micro-queue
            containerapp: qlanka-micro-queue

    steps:
      - name: Resolve Azure auth mode
        id: authmode
        shell: bash
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [ -n "$AZURE_CREDENTIALS" ]; then
            echo "use_sp=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_sp=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login with service principal JSON
        if: ${{ steps.authmode.outputs.use_sp == 'true' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Azure login with OIDC
        if: ${{ steps.authmode.outputs.use_sp != 'true' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy ${{ matrix.service.name }} image to Container App
        shell: bash
        run: |
          az containerapp update \
            --name "${{ matrix.service.containerapp }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service.name }}:${{ github.sha }}"

      - name: Set Queue env vars
        if: ${{ matrix.service.name == 'qlanka-micro-queue' }}
        shell: bash
        run: |
          az containerapp update \
            --name "${{ matrix.service.containerapp }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --set-env-vars \
              ServiceUrls__ServiceCenter=${{ env.QUEUE_SERVICECENTER_URL }} \
              Jwt__Issuer=queuelanka-api \
              Jwt__Audience=queuelanka-client

      - name: Route 100% traffic to newest revision
        shell: bash
        run: |
          az containerapp revision set-mode \
            --name "${{ matrix.service.containerapp }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --mode single

  post-deploy-smoke:
    runs-on: ubuntu-latest
    needs: deploy-containerapps
    env:
      GATEWAY_URL: ${{ vars.GATEWAY_PUBLIC_URL }}

    steps:
      - name: Resolve gateway URL
        shell: bash
        run: |
          if [ -z "${GATEWAY_URL}" ]; then
            echo "GATEWAY_PUBLIC_URL repository variable is required for smoke checks."
            exit 1
          fi

      - name: Verify gateway health endpoint
        shell: bash
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "${GATEWAY_URL}/health" || echo "000")
          if [ "$status" != "200" ]; then
            echo "Gateway health check failed with HTTP $status"
            exit 1
          fi

      - name: Verify appointment route is reachable
        shell: bash
        run: |
          status=$(curl -s -o /tmp/appointment-response.txt -w "%{http_code}" \
            -X POST "${GATEWAY_URL}/api/appointment/book" \
            -H "Content-Type: application/json" \
            -d '{"centerId":1,"appointmentDate":"2026-03-24T00:00:00Z","appointmentTime":"10:00:00"}' || echo "000")

          echo "appointment route status: $status"
          cat /tmp/appointment-response.txt || true

          if [ "$status" = "404" ] || [ "$status" = "000" ]; then
            echo "Appointment route is not reachable (HTTP $status)."
            exit 1
          fi

          if [ "$status" != "401" ] && [ "$status" != "403" ] && [ "$status" != "400" ] && [ "$status" != "409" ] && [ "$status" != "200" ]; then
            echo "Unexpected appointment route status: $status"
            exit 1
          fi
