name: Build & Deploy Microservices

on:
  push:
    branches: [feature/microservices, main]
    paths:
      - 'backend/**'
  workflow_dispatch: # Allow manual trigger

env:
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
  RESOURCE_GROUP: rg-queuelanka-pro

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: qlanka-gateway
            dockerfile: QueueLanka.Gateway/Dockerfile
          - name: qlanka-identity
            dockerfile: QueueLanka.Identity/Dockerfile
          - name: qlanka-servicecenter
            dockerfile: QueueLanka.ServiceCenter/Dockerfile
          - name: qlanka-queue
            dockerfile: QueueLanka.Queue/Dockerfile
          - name: qlanka-notification
            dockerfile: QueueLanka.Notification/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service.name }}:latest,${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service.name }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Gateway
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update -n qlanka-gateway -g ${{ env.RESOURCE_GROUP }} \
              --image ${{ secrets.ACR_LOGIN_SERVER }}/qlanka-gateway:${{ github.sha }}

      - name: Deploy Identity
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update -n qlanka-identity -g ${{ env.RESOURCE_GROUP }} \
              --image ${{ secrets.ACR_LOGIN_SERVER }}/qlanka-identity:${{ github.sha }}

      - name: Deploy Service Center
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update -n qlanka-servicecenter -g ${{ env.RESOURCE_GROUP }} \
              --image ${{ secrets.ACR_LOGIN_SERVER }}/qlanka-servicecenter:${{ github.sha }}

      - name: Deploy Queue
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update -n qlanka-queue -g ${{ env.RESOURCE_GROUP }} \
              --image ${{ secrets.ACR_LOGIN_SERVER }}/qlanka-queue:${{ github.sha }}

      - name: Deploy Notification
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update -n qlanka-notification -g ${{ env.RESOURCE_GROUP }} \
              --image ${{ secrets.ACR_LOGIN_SERVER }}/qlanka-notification:${{ github.sha }}
