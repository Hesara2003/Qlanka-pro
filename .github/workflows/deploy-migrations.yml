name: Apply Database Migrations

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which migrations to apply (all | identity | queue | service-centre)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - identity
          - queue
          - service-centre

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      MYSQL_HOST: identity-db.mysql.database.azure.com
      MYSQL_PORT: 3306
      MYSQL_USER: admin_identity
      MYSQL_PWD: ${{ secrets.DB_ADMIN_PASSWORD }}
      MYSQL_SSL: "--ssl-mode=REQUIRED"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Wait for Azure MySQL connectivity
        run: |
          for i in {1..10}; do
            if mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" $MYSQL_SSL \
                -e "SELECT 1" > /dev/null 2>&1; then
              echo "MySQL is reachable"
              exit 0
            fi
            echo "Attempt $i failed — retrying in 5s..."
            sleep 5
          done
          echo "MySQL did not become reachable. Verify firewall rules allow GitHub Actions IPs."
          exit 1

      - name: Apply Identity migrations
        if: ${{ inputs.target == 'all' || inputs.target == 'identity' }}
        run: |
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" $MYSQL_SSL \
            -e "CREATE DATABASE IF NOT EXISTS \`identity\`;"
          for f in $(find backend/QueueLanka.Identity/Database/Migrations -name "*.sql" | sort); do
            echo "Applying $f"
            mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" $MYSQL_SSL identity < "$f"
          done
          echo "Identity migrations complete."

      - name: Apply Queue migrations
        if: ${{ inputs.target == 'all' || inputs.target == 'queue' }}
        run: |
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" $MYSQL_SSL \
            -e "CREATE DATABASE IF NOT EXISTS \`queue\`;"
          for f in $(find backend/QueueLanka.Queue/Database/Migrations -name "*.sql" | sort); do
            echo "Applying $f"
            mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" $MYSQL_SSL queue < "$f"
          done
          echo "Queue migrations complete."

      - name: Apply ServiceCentre migrations
        if: ${{ inputs.target == 'all' || inputs.target == 'service-centre' }}
        run: |
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" $MYSQL_SSL \
            -e "CREATE DATABASE IF NOT EXISTS \`service-centre\`;"
          for f in $(find backend/QueueLanka.ServiceCenter/Database/Migrations -name "*.sql" | sort); do
            echo "Applying $f"
            mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" $MYSQL_SSL 'service-centre' < "$f"
          done
          echo "ServiceCentre migrations complete."

      - name: Verify schemas
        run: |
          mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" $MYSQL_SSL \
            -e "SHOW DATABASES LIKE 'identity'; SHOW DATABASES LIKE 'queue'; SHOW DATABASES LIKE 'service-centre';"
