name: Deploy Frontend

on:
  push:
    branches: [feature/microservices, backup]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

env:
  AZURE_API_BASE_URL: https://20.193.250.12:9443
  AZURE_FRONTEND_URL: https://queuelanka-frontend-hrcvdec5dnach0aj.centralindia-01.azurewebsites.net

jobs:
  deploy-frontend:
    name: Deploy Frontend → Azure App Service
    runs-on: ubuntu-latest
    environment:
      name: develop

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: frontend
      run: npm ci

    - name: Validate fallback secrets
      run: |
        if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ] || [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then
          echo "Missing required frontend fallback secrets: VITE_SUPABASE_URL and/or VITE_SUPABASE_ANON_KEY"
          exit 1
        fi

    - name: Build frontend
      working-directory: frontend
      run: npm run build
      env:
        VITE_API_BASE_URL: ${{ env.AZURE_API_BASE_URL }}
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    - name: Prune dev dependencies
      working-directory: frontend
      run: npm prune --production

    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ secrets.AZURE_FRONTEND_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_FRONTEND_WEBAPP_PUBLISH_PROFILE }}
        package: ./frontend

    - name: Verify frontend deployment
      run: |
        url="${{ env.AZURE_FRONTEND_URL }}"
        echo "Checking $url ..."
        for i in $(seq 1 10); do
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url" || echo "000")
          if [ "$status" = "200" ]; then
            echo "Frontend deployment verified – HTTP $status"
            exit 0
          fi
          echo "Attempt $i/10 – HTTP $status. Retrying in 15 seconds..."
          sleep 15
        done
        exit 1
