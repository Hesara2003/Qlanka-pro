name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend
        run: |
          dotnet restore Qlanka-pro.sln
          dotnet build Qlanka-pro.sln --configuration Release --no-restore

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Create release archive
        run: |
          mkdir -p release-artifacts
          tar -czf release-artifacts/release-${GITHUB_REF_NAME:-manual}.tar.gz backend frontend

      - name: Generate changelog notes
        id: notes
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          mode: COMMIT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.changelog }}
          files: |
            release-artifacts/*.tar.gz

