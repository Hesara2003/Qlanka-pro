name: Playwright E2E

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "QueueLanka.SmokeTests/**"
      - "docker-compose.yml"
      - ".github/workflows/playwright-e2e.yml"
  push:
    branches:
      - main
      - feature/microservices
    paths:
      - "frontend/**"
      - "backend/**"
      - "QueueLanka.SmokeTests/**"
      - "docker-compose.yml"
      - ".github/workflows/playwright-e2e.yml"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: QueueLanka.SmokeTests/package-lock.json

      - name: Install smoke test dependencies
        working-directory: QueueLanka.SmokeTests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: QueueLanka.SmokeTests
        run: npx playwright install --with-deps chromium

      - name: Start docker compose stack
        run: docker compose up -d --build

      - name: Wait for frontend and gateway
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:5000/health >/dev/null && curl -fsS http://localhost:3000 >/dev/null; then
              echo "Services are ready."
              exit 0
            fi

            echo "Waiting for services... (${attempt}/60)"
            sleep 10
          done

          echo "Services did not become ready in time."
          docker compose ps
          docker compose logs --no-color --tail 200
          exit 1

      - name: Run Playwright E2E tests
        working-directory: QueueLanka.SmokeTests
        env:
          SMOKE_BASE_URL: http://localhost:5000
          API_BASE_URL: http://localhost:5000
          UI_BASE_URL: http://localhost:3000
        run: npx playwright test tests/*.e2e.test.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: QueueLanka.SmokeTests/playwright-report

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: QueueLanka.SmokeTests/test-results